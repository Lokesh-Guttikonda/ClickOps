name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Offline demo on a bare interpreter (nothing installed yet)
        run: python scripts/demo_offline.py --no-color --quiet

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests (offline)
        run: pytest

      - name: CLI smoke test
        run: >-
          terradrift reconcile -C examples
          --plan-json examples/drifted_plan.json
          --cloudtrail-events examples/cloudtrail_events.json
          --dry-run --no-color
